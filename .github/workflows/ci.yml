name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python:
    name: Engine (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install test dependency
        run: python -m pip install --upgrade pip pytest
      - name: Run engine and parity tests
        run: python -m pytest -q
      - name: Check generated Worker config is current
        run: python tools/sync_worker_config.py --check
      - name: Check parity fixtures are current
        run: python tools/generate_parity_fixtures.py --check
      - name: CLI smoke test
        run: |
          echo '{"a1":["single_parent"],"a2":"neglectful","a3_1":4}' > /tmp/case.json
          PYTHONPATH=core python -m riskcore.cli --answers /tmp/case.json --summary

  worker:
    name: Worker (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: ["20", "22"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
      - name: Install dependencies
        working-directory: apps/worker
        run: npm install --no-audit --no-fund
      - name: Typecheck
        working-directory: apps/worker
        run: npm run check
      - name: Build
        working-directory: apps/worker
        run: npm run build
      - name: Cross-language parity tests
        run: node --test tests/node/engine.test.mjs tests/node/api.test.mjs

  dashboard:
    name: Dashboard imports and bootstraps
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dashboard requirements
        run: python -m pip install --upgrade pip -r apps/dashboard/requirements.txt
      - name: Compile check
        run: python -m compileall -q apps/dashboard/app.py
      - name: Import check
        run: |
          PYTHONPATH=core python - <<'PY'
          import importlib.util, pathlib
          spec = importlib.util.spec_from_file_location("dashboard_app", pathlib.Path("apps/dashboard/app.py"))
          module = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(module)
          config = module.bootstrap_config()
          assert len(config.sections) == 7, len(config.sections)
          print("dashboard module loads; sections:", len(config.sections))
          PY

  docker:
    name: Docker image builds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: proofreading-model:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

# Single-host deployment for the screening dashboard.
#
#   docker compose -f deploy/docker-compose.yml up -d
#
# The dashboard binds to loopback only: TLS and the public hostname belong to the
# reverse proxy in front of it (see Caddyfile). No case data is written to disk by the
# application, so there is nothing to mount for persistence.

services:
  dashboard:
    build:
      context: ..
      dockerfile: Dockerfile
    image: proofreading-model:latest
    restart: unless-stopped
    environment:
      RISKCORE_CONFIG_DIR: /app/config
      STREAMLIT_BROWSER_GATHER_USAGE_STATS: "false"
      STREAMLIT_SERVER_HEADLESS: "true"
    ports:
      - "127.0.0.1:8501:8501"
    volumes:
      - ../config:/app/config:ro
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8501/_stcore/health', timeout=3).read()"
      interval: 60s
      timeout: 5s
      retries: 3
      start_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # Optional: an in-memory cache for the Worker's static assets if it is ever run
  # containerised. The shipped Worker deploys to Cloudflare instead.
  # worker:
  #   build: ../apps/worker
  #   ports: ["127.0.0.1:8787:8787"]

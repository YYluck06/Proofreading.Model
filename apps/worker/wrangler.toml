# Cloudflare Worker deployment for the screening API + static UI.
# Copy this file's variable block into `.dev.vars` for local overrides.

name = "proofreading-risk-worker"
main = "src/index.ts"
compatibility_date = "2026-03-31"
compatibility_flags = ["nodejs_compat"]

workers_dev = true

[observability]
enabled = true

[assets]
directory = "./public"
binding = "ASSETS"
# The UI is a single page; everything it needs is requested explicitly.
not_found_handling = "none"

[vars]
ENVIRONMENT = "production"
# Leave empty to disable cross-origin access entirely (same-origin UI only).
# Set a comma-separated allowlist, e.g. "https://review.example.org".
ALLOWED_ORIGINS = ""
